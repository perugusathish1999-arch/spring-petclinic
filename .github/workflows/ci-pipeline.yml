# ci workflow for building and testing the Spring PetClinic application
name: CI DevSecOps Pipeline
on:
  pull_request:
    branches:
      - main
jobs:
    DevSecOps:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up JDK 17
          uses: actions/setup-java@v4
          with:
            distribution: 'temurin'
            java-version: '17'

        - name: Build and test with Maven
          run: mvn clean test
        
        - name: codeql-scan
          uses: github/codeql-action/init@v3
          with:
            languages: 'java'

        - name: Perform CodeQL Analysis
          uses: github/codeql-action/analyze@v3

        - name: Dependency check
          uses: dependency-check/Dependency-Check_Action@main
          with:
            project: 'Spring-PetClinic'
            path: .
          continue-on-error: true

        - name: secrets scan
          uses: gitleaks/gitleaks-action@v2
          continue-on-error: true
        
        - name: Build application artifact
          run: mvn package -DskipTests

        - name: create Docker image
          run: docker build -t spring-petclinic:${{github.sha}} .
        
        - name: Scan Docker image for vulnerabilities
          uses: aquasecurity/trivy-action@master
          with:
            image-ref: spring-petclinic:${{github.sha}}
            severity: HIGH,CRITICAL
            exit-code: '0'
        - name: login to DockerHub
          uses: docker/login-action@v2
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
        - name: push Docker image to DockerHub
          run: |
            docker tag spring-petclinic:${{github.sha}} ${{ secrets.DOCKERHUB_USERNAME }}/spring-petclinic:${{github.sha}}
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/spring-petclinic:${{github.sha}}